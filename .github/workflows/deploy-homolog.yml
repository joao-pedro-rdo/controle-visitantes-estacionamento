name: Build and deploy homolog

on:
  push:
    branches: [homolog]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".vscode/**"

permissions:
  contents: read

concurrency:
  group: deploy-homolog
  cancel-in-progress: false

env:
  BACKEND_IMAGE: joaoprdo/controle-visitantes-backend
  FRONTEND_IMAGE: joaoprdo/controle-visitantes-frontend

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:homolog
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            REACT_APP_API_URL=/api
          tags: |
            ${{ env.FRONTEND_IMAGE }}:homolog
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: [selfhosted-homolog-gda, homolog-gda]
    environment: homolog
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install deployment files in the host directory
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_PATH"
          mkdir -p "$DEPLOY_PATH/docker" "$DEPLOY_PATH/frontend/public"
          cp docker/compose.yaml docker/compose.nginx.yaml docker/nginx.conf "$DEPLOY_PATH/docker/"
          cp -a frontend/public/. "$DEPLOY_PATH/frontend/public/"
      - name: Pull and restart homolog services
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          export IMAGE_TAG=homolog
          docker compose --project-name controle-homolog --env-file "$DEPLOY_PATH/.env" \
            -f "$DEPLOY_PATH/docker/compose.yaml" -f "$DEPLOY_PATH/docker/compose.nginx.yaml" pull backend frontend
          docker compose --project-name controle-homolog --env-file "$DEPLOY_PATH/.env" \
            -f "$DEPLOY_PATH/docker/compose.yaml" -f "$DEPLOY_PATH/docker/compose.nginx.yaml" up -d --wait
